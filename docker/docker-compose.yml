services:
  sprite-tool:
    build:
      context: ..
      dockerfile: docker/Dockerfile.sprite-tool
    image: mcp-sprite-tool:latest
    container_name: mcp-sprite-tool
    volumes:
      - shared-assets:/mnt/assets
      - ../assets:/mnt/host-assets
    environment:
      - MCP_CONTAINER_MODE=true
      - SHARED_VOLUME_PATH=/mnt/assets
    healthcheck:
      test: ["CMD", "/usr/local/bin/sprite_tool", "--health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - mcp-network

  tile-checker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.tile-checker
    image: mcp-tile-checker:latest
    container_name: mcp-tile-checker
    volumes:
      - shared-assets:/mnt/assets
      - ../assets:/mnt/host-assets
    environment:
      - MCP_CONTAINER_MODE=true
      - SHARED_VOLUME_PATH=/mnt/assets
    healthcheck:
      test: ["CMD", "/usr/local/bin/tile_checker", "--health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - mcp-network
    depends_on:
      - sprite-tool

  map-maker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.map-maker
    image: mcp-map-maker:latest
    container_name: mcp-map-maker
    volumes:
      - shared-assets:/mnt/assets
      - ../assets:/mnt/host-assets
    environment:
      - MCP_CONTAINER_MODE=true
      - SHARED_VOLUME_PATH=/mnt/assets
    healthcheck:
      test: ["CMD", "/usr/local/bin/map_maker", "--health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - mcp-network
    depends_on:
      - tile-checker

  preview-tool:
    build:
      context: ..
      dockerfile: docker/Dockerfile.preview-tool
    image: mcp-preview-tool:latest
    container_name: mcp-preview-tool
    volumes:
      - shared-assets:/mnt/assets
      - ../assets:/mnt/host-assets
    environment:
      - MCP_CONTAINER_MODE=true
      - SHARED_VOLUME_PATH=/mnt/assets
    healthcheck:
      test: ["CMD", "/usr/local/bin/preview_tool", "--health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - mcp-network
    depends_on:
      - map-maker

volumes:
  shared-assets:
    driver: local

networks:
  mcp-network:
    driver: bridge
